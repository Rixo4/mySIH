<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Silicon Patient Platform</title>
    <script type="text/javascript">
      // Redirect 404s to the index.html with the path preserved
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          '/startup/?' +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '&p=/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/') +
          (l.search ? '&q=' + l.search.slice(1) : '') +
          l.hash
      );
    </script>
  </head>
  <body />
</html>
